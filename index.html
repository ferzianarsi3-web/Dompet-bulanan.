<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#102b35"><title>Dompet Bulanan</title>
<style>
:root{--ink:#132f38;--muted:#74858a;--bg:#f3f6f5;--green:#14966d;--red:#d95d5d;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,-apple-system,Segoe UI,sans-serif}header{padding:22px 20px 16px;background:#102b35;color:#fff;border-radius:0 0 24px 24px}header small{color:#b7cbca}header h1{font-size:21px;margin:2px 0 18px}.balance{font-size:30px;font-weight:750;letter-spacing:-1px;margin:5px 0 16px}.summary{display:flex;gap:12px}.sum{flex:1;background:#ffffff13;padding:12px;border-radius:13px}.sum small{display:block;color:#c3d5d2;font-size:11px}.sum b{display:block;margin-top:5px;font-size:14px}.wrap{padding:16px 16px 90px;max-width:620px;margin:auto}.section{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.section h2{font-size:16px;margin:0}.muted{color:var(--muted);font-size:12px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.action{background:white;border:0;border-radius:14px;padding:13px 4px;color:var(--ink);font-weight:650;font-size:11px;box-shadow:0 2px 10px #1a3b3b08}.action span{display:block;font-size:21px;margin-bottom:5px}.card{background:white;border-radius:17px;padding:15px;margin-bottom:11px;box-shadow:0 2px 12px #193c3c08}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.tx{padding:12px 0;border-bottom:1px solid #eef1f0}.tx:last-child{border:0}.dot{width:38px;height:38px;background:#edf5f1;border-radius:12px;display:grid;place-items:center;font-size:18px;margin-right:10px}.txname{font-weight:650;font-size:13px}.amount{font-weight:700;font-size:13px}.in{color:var(--green)}.out{color:var(--red)}button{cursor:pointer}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e9eeec;display:flex;justify-content:space-around;padding:9px 4px calc(9px + env(safe-area-inset-bottom));z-index:5}nav button{border:0;background:none;color:#718186;font-size:10px}nav button b{display:block;font-size:20px;margin-bottom:2px}nav button.active{color:var(--green)}.hidden{display:none}.field{margin:12px 0}.field label{display:block;font-size:12px;color:#64767a;margin-bottom:6px}input,select{width:100%;border:1px solid #dfe7e4;border-radius:11px;padding:12px;font:inherit;background:#fff;color:var(--ink)}.primary{background:var(--green);color:white;border:0;border-radius:12px;padding:13px 16px;font-weight:700;width:100%;margin-top:8px}.tabs{display:flex;gap:8px}.tabs button{flex:1;border:1px solid #dfe8e4;background:white;padding:10px;border-radius:10px}.tabs button.sel{background:#e5f4ed;border-color:#b5dfcb;color:#087b56}.bar{height:9px;background:#edf1ef;border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--green);border-radius:9px}.empty{text-align:center;padding:26px;color:#829196;font-size:13px}.pill{font-size:11px;padding:5px 8px;border-radius:20px;background:#eef5f1;color:#268363}
</style></head><body>
<header><small id="monthLabel">RINGKASAN BULAN INI</small><h1>Dompet Bulanan</h1><small>Total saldo</small><div class="balance" id="balance">Rp0</div><div class="summary"><div class="sum"><small>↗ Pemasukan</small><b id="income">Rp0</b></div><div class="sum"><small>↘ Pengeluaran</small><b id="expense">Rp0</b></div></div></header>
<main class="wrap">
<section id="home">
<div class="section"><h2>Akses cepat</h2><span class="muted">Kelola uangmu</span></div>
<div class="actions"><button class="action" onclick="openForm('in')"><span>＋</span>Pemasukan</button><button class="action" onclick="openForm('out')"><span>－</span>Pengeluaran</button><button class="action" onclick="show('budget')"><span>▤</span>Anggaran</button><button class="action" onclick="show('report')"><span>▥</span>Laporan</button></div>
<div class="section"><h2>Transaksi terbaru</h2><button class="muted" style="border:0;background:none" onclick="show('history')">Lihat semua →</button></div><div class="card" id="recent"></div>
<div class="section"><h2>Ringkasan pengeluaran</h2></div><div class="card" id="miniReport"></div>
</section>
<section id="history" class="hidden"><div class="section"><h2>Semua transaksi</h2><span class="muted" id="count"></span></div>
<div class="field"><input id="searchTx" placeholder="Cari keterangan atau kategori..." oninput="renderHistory()"></div>
<div class="card" id="allTx"></div></section>
<section id="budget" class="hidden"><div class="section"><h2>Anggaran bulanan</h2></div><div class="card"><div class="field"><label>Batas pengeluaran bulan ini (Rp)</label><input id="budgetInput" type="number" min="0" placeholder="Contoh: 3000000"></div><button class="primary" onclick="saveBudget()">Simpan anggaran</button></div><div class="card" id="budgetView"></div></section>
<section id="report" class="hidden"><div class="section"><h2>Laporan keuangan</h2></div><div class="card" id="reportView"></div><div class="card"><button class="primary" onclick="exportCsv()">Unduh laporan CSV</button><button class="primary" style="background:#e8f2ee;color:#176b50" onclick="backup()">Cadangkan data (JSON)</button><div class="field"><label>Pulihkan cadangan JSON</label><input type="file" id="restoreFile" accept=".json"></div><button class="primary" style="background:#52666b" onclick="restore()">Pulihkan data</button></div></section>
<section id="form" class="hidden"><div class="section"><h2 id="formTitle">Tambah transaksi</h2><button onclick="show('home')" style="border:0;background:none;color:#60777a">Batal</button></div><div class="card"><div class="tabs"><button id="tabIn" onclick="setType('in')">Pemasukan</button><button id="tabOut" onclick="setType('out')">Pengeluaran</button></div><div class="field"><label>Nominal (Rp)</label><input id="amount" type="number" min="1" inputmode="numeric" placeholder="0"></div><div class="field"><label>Keterangan</label><input id="note" placeholder="Contoh: Gaji, makan, transportasi"></div><div class="field"><label>Kategori</label><select id="category"></select></div><div class="field"><label>Tanggal</label><input id="date" type="date"></div><button class="primary" onclick="saveTx()">Simpan transaksi</button></div></section>
</main><nav><button class="active" data-page="home" onclick="show('home')"><b>⌂</b>Beranda</button><button data-page="history" onclick="show('history')"><b>↔</b>Transaksi</button><button data-page="budget" onclick="show('budget')"><b>▤</b>Anggaran</button><button data-page="report" onclick="show('report')"><b>▥</b>Laporan</button></nav>
<script>
const $=id=>document.getElementById(id), fmt=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
let tx=JSON.parse(localStorage.getItem('db_tx')||'[]'), budget=Number(localStorage.getItem('db_budget')||0), type='out', editingId=null;
const cats={in:['Gaji','Bisnis','Bonus','Investasi','Hadiah','Lainnya'],out:['Makanan','Transportasi','Belanja','Tagihan','Kesehatan','Pendidikan','Hiburan','Rumah tangga','Lainnya']};
function persist(){localStorage.setItem('db_tx',JSON.stringify(tx));localStorage.setItem('db_budget',budget)}
function monthTx(){let m=new Date().toISOString().slice(0,7);return tx.filter(t=>t.date.slice(0,7)===m)}
function totals(a){return a.reduce((o,t)=>(o[t.type]+=t.amount,o),{in:0,out:0})}
function render(){let a=monthTx(),s=totals(a);$('balance').textContent=fmt(s.in-s.out);$('income').textContent=fmt(s.in);$('expense').textContent=fmt(s.out);$('monthLabel').textContent=new Date().toLocaleDateString('id-ID',{month:'long',year:'numeric'}).toUpperCase();$('recent').innerHTML=tx.slice().sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id).slice(0,5).map(itemHTML).join('')||'<div class="empty">Belum ada transaksi. Mulai catat keuanganmu.</div>';renderHistory();let groups={};a.filter(t=>t.type==='out').forEach(t=>groups[t.cat]=(groups[t.cat]||0)+t.amount);let entries=Object.entries(groups).sort((x,y)=>y[1]-x[1]);$('miniReport').innerHTML=entries.slice(0,4).map(([k,v])=>`<div style="margin:10px 0"><div class="row"><b style="font-size:13px">${k}</b><span class="muted">${fmt(v)}</span></div><div class="bar"><i style="width:${s.out?v/s.out*100:0}%"></i></div></div>`).join('')||'<div class="empty">Belum ada pengeluaran bulan ini.</div>';$('budgetInput').value=budget||'';$('budgetView').innerHTML=budget?`<div class="row"><b>Terpakai bulan ini</b><b>${fmt(s.out)}</b></div><div class="bar"><i style="width:${Math.min(100,s.out/budget*100)}%"></i></div><p class="muted">${Math.max(0,budget-s.out)>0?'Sisa anggaran: '+fmt(budget-s.out):'Anggaran terlampaui sebesar '+fmt(s.out-budget)}</p>`:'<div class="empty">Atur batas pengeluaran agar keuangan lebih terkontrol.</div>';$('reportView').innerHTML=`<div class="row"><span>Pemasukan bulan ini</span><b class="in">${fmt(s.in)}</b></div><div class="row" style="margin:14px 0"><span>Pengeluaran bulan ini</span><b class="out">${fmt(s.out)}</b></div><div class="row"><span>Selisih</span><b>${fmt(s.in-s.out)}</b></div><p class="muted">${a.length} transaksi pada bulan ini</p>`}
function itemHTML(t){return `<div class="tx"><div class="row"><div class="row" style="justify-content:flex-start"><div class="dot">${t.type==='in'?'↗':'↘'}</div><div><div class="txname">${esc(t.note)}</div><div class="muted">${esc(t.cat)} · ${new Date(t.date+'T00:00:00').toLocaleDateString('id-ID')}</div></div></div><div class="amount ${t.type==='in'?'in':'out'}">${t.type==='in'?'+':'−'}${fmt(t.amount)}</div></div><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="muted" style="border:0;background:none" onclick="editTransaction(${t.id})">✎ Edit</button><button class="muted" style="border:0;background:none;color:var(--red)" onclick="deleteTransaction(${t.id})">Hapus</button></div></div>`}
function renderHistory(){let q=($('searchTx')?.value||'').toLowerCase();let list=tx.slice().sort((x,y)=>y.date.localeCompare(x.date)||y.id-x.id).filter(t=>(t.note+' '+t.cat).toLowerCase().includes(q));$('allTx').innerHTML=list.map(itemHTML).join('')||'<div class="empty">Tidak ada transaksi yang cocok.</div>';$('count').textContent=list.length+' transaksi';}
function editTransaction(id){let t=tx.find(x=>x.id===id);if(!t)return;editingId=id;setType(t.type);$('amount').value=t.amount;$('note').value=t.note;$('category').value=t.cat;$('date').value=t.date;$('formTitle').textContent='Edit transaksi';show('form')}
function deleteTransaction(id){if(!confirm('Hapus transaksi ini?'))return;tx=tx.filter(t=>t.id!==id);persist();render()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(p){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));$(p).classList.remove('hidden');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function setType(t){type=t;$('tabIn').classList.toggle('sel',t==='in');$('tabOut').classList.toggle('sel',t==='out');$('formTitle').textContent=t==='in'?'Tambah pemasukan':'Tambah pengeluaran';$('category').innerHTML=cats[t].map(c=>`<option>${c}</option>`).join('')}
function openForm(t){editingId=null;setType(t);$('amount').value='';$('note').value='';$('date').value=new Date().toISOString().slice(0,10);$('formTitle').textContent=t==='in'?'Tambah pemasukan':'Tambah pengeluaran';show('form')}
function saveTx(){let amount=Number($('amount').value),note=$('note').value.trim();if(!amount||amount<1||!note){alert('Isi nominal dan keterangan dengan benar.');return}let record={id:editingId||Date.now(),type,amount,note,cat:$('category').value,date:$('date').value||new Date().toISOString().slice(0,10)};if(editingId!==null){tx=tx.map(t=>t.id===editingId?record:t);editingId=null}else tx.push(record);persist();show('home')}
function saveBudget(){budget=Math.max(0,Number($('budgetInput').value));persist();render();alert('Anggaran disimpan.')}
function exportCsv(){let rows=[['Tanggal','Jenis','Keterangan','Kategori','Nominal'],...tx.map(t=>[t.date,t.type==='in'?'Pemasukan':'Pengeluaran',t.note,t.cat,t.amount])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n');download('\ufeff'+csv,'dompet-bulanan.csv','text/csv')}
function backup(){download(JSON.stringify({tx,budget},null,2),'cadangan-dompet-bulanan.json','application/json')}
function download(data,name,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function restore(){let f=$('restoreFile').files[0];if(!f){alert('Pilih file cadangan terlebih dahulu.');return}let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.tx))throw 0;tx=d.tx;budget=Number(d.budget)||0;persist();render();alert('Data berhasil dipulihkan.')}catch(e){alert('File cadangan tidak valid.')}};r.readAsText(f)}
setType('out');render();
</script></body></html>
